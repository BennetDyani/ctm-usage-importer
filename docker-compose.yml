# Local database for development and tests — the same Postgres major version Supabase runs (17).
# Not used in production: Vercel hosts the app and Supabase hosts the real database.
#   npm run db:up      start it (waits until healthy)
#   npm run db:test    run migrations + integration tests against it
#   npm run db:down    stop it and delete its data
services:
  db:
    image: postgres:17-alpine
    container_name: ctm-postgres
    environment:
      POSTGRES_PASSWORD: postgres   # local throwaway database only; never used anywhere else
    ports:
      - "54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data   # data lives in memory: every start is a clean database
